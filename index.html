<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Modern Sudoku</title>
    <link rel="stylesheet" href="style.css" />
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  </head>
  <body>
    <div class="app-layout">
      <!-- Vertical Icon Sidebar -->
      <nav class="sidebar" aria-label="Game controls">
        <button id="nav-new-btn" title="New Game" aria-label="Start a new game">
          <img
            src="Icons/add-svgrepo-com.svg"
            alt=""
            height="30px"
            width="30px"
          />
        </button>
        <button id="nav-difficulty-btn" title="Set Difficulty" aria-label="Set difficulty">
          <img
            src="Icons/levels-svgrepo-com.svg"
            alt=""
            height="30px"
            width="30px"
          />
        </button>
        <button id="nav-bulb-btn" title="Tools & Hints" aria-label="Open tools and hints menu">
          <img
            src="Icons/bulb-on-svgrepo-com.svg"
            alt=""
            height="30px"
            width="30px"
          />
        </button>
        <button id="nav-undo-btn" title="Undo Last Move (Ctrl+Z)" aria-label="Undo last move">
          <img
            src="Icons/undo-svgrepo-com.svg"
            alt=""
            height="30px"
            width="30px"
          />
        </button>
        <button id="nav-redo-btn" title="Redo Last Move (Ctrl+Y)" aria-label="Redo last move">
          <img
            src="Icons/undo-svgrepo-com.svg"
            alt=""
            height="30px"
            width="30px"
            class="icon-flip"
          />
        </button>
        <button id="nav-restart-btn" title="Restart Current Board" aria-label="Restart current board">
          <img
            src="Icons/restart-svgrepo-com.svg"
            alt=""
            height="30px"
            width="30px"
          />
        </button>
        <div class="sidebar-spacer"></div>
        <button id="nav-ai-btn" class="ai-nav-btn" title="AI Tutor" aria-label="Open AI tutor">
  <!-- Default to the static image. We will swap it to the GIF using JavaScript -->
  <img
    id="ai-bot-icon"
    src="Icons/icons8-bot-static.png" 
    alt="AI Tutor"
    height="28px"
    width="28px"
    style="display: block;"
  />
</button>
      </nav>

      <!-- Main Content Area -->
      <div class="main-content">
        <header class="header">
          <div class="header-left"></div>
          <div class="header-center">
            <div id="timer" aria-label="Elapsed time">00:00</div>
            <div id="best-time" class="best-time-label">Best: --:--</div>
          </div>
          <div class="header-right">
            <h1>SUDOKU GAME</h1>
            <button id="settings-btn" title="Settings" aria-label="Open settings">⚙️</button>
          </div>
        </header>

        <main class="game-container">
          <!-- Left Side: Numpad -->
          <div class="left-panel">
            <p id="message" role="status" aria-live="polite"></p>

            <!-- Pencil Mode Button -->
            <button
              id="pencil-btn"
              class="menu-btn secondary"
              title="Toggle pencil mode (P)"
              style="
                margin-bottom: 15px;
                width: 100%;
                display: flex;
                justify-content: center;
                align-items: center;
                gap: 8px;
              "
            >
              <span style="font-size: 20px"
                ><img
                  src="Icons/pen-solid-full.svg"
                  alt=""
                  height="20px"
                  width="20px"
              /></span>
              Pencil Mode: OFF
            </button>

            <div id="numpad">
              <div class="numpad-row">
                <button class="numpad-btn" data-val="1" aria-label="Enter 1" aria-pressed="false">
                  <span class="number">1</span
                  ><span class="count" id="count-1">9</span>
                </button>
                <button class="numpad-btn" data-val="2" aria-label="Enter 2" aria-pressed="false">
                  <span class="number">2</span
                  ><span class="count" id="count-2">9</span>
                </button>
                <button class="numpad-btn" data-val="3" aria-label="Enter 3" aria-pressed="false">
                  <span class="number">3</span
                  ><span class="count" id="count-3">9</span>
                </button>
                <button class="numpad-btn" data-val="4" aria-label="Enter 4" aria-pressed="false">
                  <span class="number">4</span
                  ><span class="count" id="count-4">9</span>
                </button>
                <button class="numpad-btn" data-val="5" aria-label="Enter 5" aria-pressed="false">
                  <span class="number">5</span
                  ><span class="count" id="count-5">9</span>
                </button>
              </div>
              <div class="numpad-row">
                <button class="numpad-btn" data-val="6" aria-label="Enter 6" aria-pressed="false">
                  <span class="number">6</span
                  ><span class="count" id="count-6">9</span>
                </button>
                <button class="numpad-btn" data-val="7" aria-label="Enter 7" aria-pressed="false">
                  <span class="number">7</span
                  ><span class="count" id="count-7">9</span>
                </button>
                <button class="numpad-btn" data-val="8" aria-label="Enter 8" aria-pressed="false">
                  <span class="number">8</span
                  ><span class="count" id="count-8">9</span>
                </button>
                <button class="numpad-btn" data-val="9" aria-label="Enter 9" aria-pressed="false">
                  <span class="number">9</span
                  ><span class="count" id="count-9">9</span>
                </button>
                <button class="numpad-btn" data-val="X" aria-label="Clear cell">
                  <span class="number">X</span><span class="count">Del</span>
                </button>
              </div>
            </div>
          </div>

          <!-- Right Side: The Board -->
          <div class="right-panel">
            <div id="board" role="grid" aria-label="Sudoku board"></div>
          </div>
        </main>
      </div>
    </div>

    <!-- Bulb Tools Modal -->
    <div id="tools-modal" class="modal hidden">
      <div class="modal-content tools-menu" role="dialog" aria-modal="true" aria-labelledby="tools-modal-title">
        <h2 id="tools-modal-title">Game Tools</h2>
        <p id="tools-hint-counter" class="hint-counter-text">Hints left: 5/5</p>
        <button id="tool-validate" class="menu-btn">Validate</button>
        <button id="tool-hint" class="menu-btn">Get a Hint</button>
        <button id="tool-notes" class="menu-btn">Automatic Notes</button>
        <button
          class="menu-btn secondary close-modal"
          data-target="tools-modal"
        >
          Close
        </button>
      </div>
    </div>

    <!-- Hint Explanation Modal -->
    <div id="hint-modal" class="modal hidden">
      <div class="modal-content text-center" role="dialog" aria-modal="true" aria-labelledby="hint-modal-title">
        <span class="close-x close-modal" data-target="hint-modal"
          >&times;</span
        >
        <h2 id="hint-modal-title">Hint</h2>
        <p id="hint-explanation" class="hint-explanation-text">
          Thinking it through...
        </p>
        <div class="confirm-actions">
          <button id="hint-gotit-btn" class="menu-btn secondary">
            Got It
          </button>
          <button id="hint-reveal-btn" class="menu-btn">
            Reveal Answer
          </button>
        </div>
      </div>
    </div>

    <!-- Difficulty Modal -->
    <div id="difficulty-modal" class="modal hidden">
      <div class="modal-content text-center" role="dialog" aria-modal="true" aria-labelledby="difficulty-modal-title">
        <span class="close-x close-modal" data-target="difficulty-modal"
          >&times;</span
        >
        <h2 id="difficulty-modal-title">Select Difficulty</h2>
        <p class="warning-text">
          Note: Starting a new game will reset your current progress.
        </p>

        <!-- Sleek Slider -->
        <div class="difficulty-slider">
          <button id="diff-prev" class="nav-arrow" aria-label="Previous difficulty">❮</button>
          <div id="diff-display" class="diff-text">Easy</div>
          <button id="diff-next" class="nav-arrow" aria-label="Next difficulty">❯</button>
        </div>

        <button id="diff-start" class="menu-btn mt-15">Start Game</button>
      </div>
    </div>

    <!-- Confirmation Modal (Are you sure?) -->
    <div id="confirm-modal" class="modal hidden">
      <div class="modal-content text-center" role="dialog" aria-modal="true" aria-labelledby="confirm-modal-title">
        <h2 id="confirm-modal-title">Warning</h2>
        <p id="confirm-message" class="confirm-message">Are you sure?</p>
        <div class="confirm-actions">
          <button id="confirm-yes" class="menu-btn">Yes</button>
          <button id="confirm-no" class="menu-btn secondary">No</button>
        </div>
      </div>
    </div>

    <!-- Settings Modal -->
    <div id="settings-modal" class="modal hidden">
      <div class="modal-content" role="dialog" aria-modal="true" aria-labelledby="settings-modal-title">
        <span class="close-x close-modal" data-target="settings-modal"
          >&times;</span
        >
        <h2 id="settings-modal-title">Settings</h2>
        <div class="setting-item">
          <span id="highlight-toggle-label">Highlight Matching Numbers</span>
          <label class="switch">
            <input type="checkbox" id="highlight-toggle" checked aria-labelledby="highlight-toggle-label" />
            <span class="slider round"></span>
          </label>
        </div>
        <!-- Dark Mode Toggle -->
        <div class="setting-item" style="margin-top: 15px">
          <span id="dark-mode-toggle-label">Dark Mode</span>
          <label class="switch">
            <input type="checkbox" id="dark-mode-toggle" aria-labelledby="dark-mode-toggle-label" />
            <span class="slider round"></span>
          </label>
        </div>
      </div>
    </div>

    <!-- AI Tutor Modal -->
    <div id="ai-tutor-modal" class="modal hidden">
      <div class="modal-content ai-tutor-content" role="dialog" aria-modal="true" aria-labelledby="ai-tutor-title">
        <span class="close-x close-modal" data-target="ai-tutor-modal"
          >&times;</span
        >
        <h2 id="ai-tutor-title">✨ AI Tutor</h2>
        <p id="ai-hint-counter" class="hint-counter-text">Hints left: 5/5</p>

        <div id="ai-chat-log" class="ai-chat-log" role="log" aria-live="polite"></div>

        <div class="ai-quick-actions">
          <button id="ai-action-hint" class="menu-btn">Give me a hint</button>
          <button id="ai-action-check" class="menu-btn secondary">
            Check my board
          </button>
        </div>

        <div class="ai-input-row">
          <input
            type="text"
            id="ai-chat-input"
            placeholder="Ask the AI tutor..."
            autocomplete="off"
            aria-label="Message the AI tutor"
          />
          <button id="ai-chat-send" class="menu-btn ai-send-btn">Send</button>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
